                  <div className="border-t border-slate-300 pt-2 flex justify-between font-bold">
                    <span>{totals.estimatedVat > 0 ? 'תשלום מע"מ משוער' : 'זיכוי מרשות המסים'}</span>
                    <span className={totals.estimatedVat > 0 ? 'text-orange-700 text-lg' : 'text-emerald-700 text-lg'}>
                      {totals.estimatedVat > 0 ? '' : '−'}₪{fmt(Math.abs(totals.estimatedVat))}
                    </span>
                  </div>
                </div>
                {/* Final VAT from accountant */}
                <div className="flex items-center justify-between mt-3 p-3 bg-indigo-50 border border-indigo-200 rounded-xl">
                  <div>
                    <div className="text-sm font-semibold text-slate-700">מע"מ סופי (הנהלת חשבונות)</div>
                    <div className="text-xs text-slate-400 mt-0.5">אם מוזן, יחליף את המע"מ המחושב</div>
                  </div>
                  <input type="number" value={income.finalVat||''} onChange={e => onUpdateIncome({...income, finalVat: e.target.value})}
                    placeholder="0"
                    className="w-32 border border-indigo-300 rounded-lg px-3 py-2 text-center text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400" />
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─── DAN TAB ──────────────────────────────────────────────────────────────

    function DanTab({ totals, danData, onUpdateDan }) {
      const pension            = num(danData.pension);
      const fund               = num(danData.fund);
      const nationalInsurance  = num(danData.nationalInsurance);
      const incomeTax          = num(danData.incomeTax);
      const totalDeductions    = pension + fund + nationalInsurance + incomeTax;
      const netPersonal        = totals.netManual - totalDeductions;

      const ProfitLine = ({ label, value, bold, note }) => (
        <div className={`flex justify-between items-start py-1.5 ${bold ? 'border-t border-slate-200 pt-2.5 mt-1' : ''}`}>
          <div>
            <span className={`text-sm ${bold ? 'font-bold text-slate-800' : 'text-slate-600'}`}>{label}</span>
            {note && <div className="text-xs text-slate-400 mt-0.5">{note}</div>}
          </div>
          <span className={`font-medium text-sm ${bold ? 'font-bold text-base' : ''} ${value >= 0 ? 'text-emerald-700' : 'text-red-600'}`}>
            {value < 0 ? '−' : ''}₪{fmt(Math.abs(value))}
          </span>
        </div>
      );

      return (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">

          {/* Clinic profits */}
          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
            <h2 className="font-semibold text-slate-800 mb-4">רווח מהמכון</h2>
            <div className="space-y-0.5">
              <ProfitLine
                label="רווח תפעולי"
                value={totals.operatingProfit}
                note="רווח מטפלים פחות הוצאות שוטפות נטו"
              />
              <ProfitLine
                label="רווח המכון"
                value={totals.netManual}
                note="הכנסות (דוח חשבוניות) פחות הוצאות נטו"
                bold
              />
            </div>
          </div>

          {/* Personal */}
          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
            <h2 className="font-semibold text-slate-800 mb-4">נטו אישי</h2>
            <div className="space-y-3">
              <div className="flex items-center justify-between">
                <label className="text-sm text-slate-700 font-medium">פנסיה</label>
                <input type="number" value={danData.pension}
                  onChange={e => onUpdateDan({ ...danData, pension: e.target.value })}
                  placeholder="0"
                  className="w-36 border border-slate-300 rounded-lg px-3 py-2 text-center text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
              </div>
              <div className="flex items-center justify-between">
                <label className="text-sm text-slate-700 font-medium">קרן השתלמות</label>
                <input type="number" value={danData.fund}
                  onChange={e => onUpdateDan({ ...danData, fund: e.target.value })}
                  placeholder="0"
                  className="w-36 border border-slate-300 rounded-lg px-3 py-2 text-center text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
              </div>
              <div className="flex items-center justify-between">
                <label className="text-sm text-slate-700 font-medium">ביטוח לאומי</label>
                <input type="number" value={danData.nationalInsurance}
                  onChange={e => onUpdateDan({ ...danData, nationalInsurance: e.target.value })}
                  placeholder="0"
                  className="w-36 border border-slate-300 rounded-lg px-3 py-2 text-center text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
              </div>
              <div className="flex items-center justify-between">
                <label className="text-sm text-slate-700 font-medium">מס הכנסה</label>
                <input type="number" value={danData.incomeTax}
                  onChange={e => onUpdateDan({ ...danData, incomeTax: e.target.value })}
                  placeholder="0"
                  className="w-36 border border-slate-300 rounded-lg px-3 py-2 text-center text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
              </div>
              <div className="border-t border-slate-200 pt-3 space-y-1">
                <div className="flex justify-between text-sm">
                  <span className="text-slate-600">רווח המכון</span>
                  <span className="font-medium">₪{fmt(totals.netManual)}</span>
                </div>
                <div className="flex justify-between text-sm">
                  <span className="text-slate-600">ניכויים (פנסיה, קרן, ב"ל, מס)</span>
                  <span className="font-medium text-red-500">−₪{fmt(totalDeductions)}</span>
                </div>
                <div className="flex justify-between font-bold text-base pt-2 border-t border-slate-200">
                  <span>נטו אישי</span>
                  <span className={netPersonal >= 0 ? 'text-emerald-700' : 'text-red-600'}>
                    {netPersonal < 0 ? '−' : ''}₪{fmt(Math.abs(netPersonal))}
                  </span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─── SHARED COMPONENTS ────────────────────────────────────────────────────

    function Th({ children, align = 'center' }) {
      return (
        <th className={`py-3 px-4 font-medium whitespace-nowrap text-${align}`}>{children}</th>
      );
    }

    function Field({ label, children }) {
      return (
        <div className="flex flex-col gap-1">
          <label className="text-xs text-slate-600">{label}</label>
          {children}
        </div>
      );
    }

    function StatCard({ label, value, color, note }) {
      const base = {
        red:   'bg-red-50 border-red-200 text-red-700',
        blue:  'bg-blue-50 border-blue-200 text-blue-700',
        slate: 'bg-slate-100 border-slate-300 text-slate-700',
        green: 'bg-emerald-50 border-emerald-200 text-emerald-700',
      }[color];
      return (
        <div className={`rounded-xl border p-4 ${base}`}>
          <div className="text-xs opacity-70 mb-1">{label}</div>
          <div className="text-2xl font-bold">{value}</div>
          {note && <div className="text-xs opacity-60 mt-1" dangerouslySetInnerHTML={{__html: note}} />}
        </div>
      );
    }

    function SumRow({ label, value, red, blue, bold }) {
      return (
        <div className={`flex justify-between items-center px-2 py-1.5 rounded ${bold ? 'font-bold bg-slate-50' : ''}`}>
          <span className={`text-sm ${bold ? 'text-slate-800' : 'text-slate-600'}`}>{label}</span>
          <span className={`text-sm ${bold ? 'font-bold text-base' : 'font-medium'} ${red ? 'text-red-600' : blue ? 'text-blue-600' : 'text-slate-800'}`}>
            {value}
          </span>
        </div>
      );
    }

    function NetRow({ label, value }) {
      const pos = value >= 0;
      return (
        <div className={`flex justify-between items-center px-3 py-2 rounded-lg border ${pos ? 'bg-emerald-50 border-emerald-200' : 'bg-red-50 border-red-200'}`}>
          <span className="text-sm font-medium text-slate-700">{label}</span>
          <span className={`font-bold text-base ${pos ? 'text-emerald-700' : 'text-red-600'}`}>
            {pos ? '+' : '−'}₪{fmt(Math.abs(value))}
          </span>
        </div>
      );
    }

    // ─── DASHBOARD TAB ────────────────────────────────────────────────────────

    const CHART_COLORS = [
      '#3b82f6','#10b981','#f59e0b','#8b5cf6','#ec4899',
      '#14b8a6','#f97316','#06b6d4','#84cc16','#e11d48',
      '#7c3aed','#0891b2','#d97706','#65a30d',
    ];

    function useChart(ref, config, deps) {
      const instanceRef = useRef(null);
      useEffect(() => {
        const canvas = ref.current;
        if (!canvas) return;
        if (instanceRef.current) instanceRef.current.destroy();
        instanceRef.current = new Chart(canvas, config());
        return () => { if (instanceRef.current) { instanceRef.current.destroy(); instanceRef.current = null; } };
      }, deps); // eslint-disable-line
    }

    function DashboardTab({ totals, therapists, therapistData, income, monthLabel, onNavigate, month, year }) {
      const pnlRef       = useRef(null);
      const compareRef   = useRef(null);
      const therapistRef = useRef(null);

      // ── Monthly P&L data (last 12 months) ──
      const pnlMonths = useMemo(() => {
        const results = [];
        for (let i = 11; i >= 0; i--) {
          let m = month - i;
          let y = year;
          while (m <= 0) { m += 12; y -= 1; }
          const key = monthKey(m, y);
          const d = fromStorage(key, null);
          if (d) {
            const inc = d.income || {};
            const expenses = d.expenses || [];
            const therapistDataM = d.therapistData || {};
            const assessorDataM = d.assessorData || {};
            let totalPayM = 0, therapistVatM = 0, assessorVatM = 0;
            therapists.forEach(t => {
              const h = num((therapistDataM[t.id] || {}).hours);
              const basePay = h * t.therapistRate;
              const vatOnPay = t.issuesInvoice ? basePay * VAT_RATE : 0;
              totalPayM += basePay + vatOnPay;
              therapistVatM += vatOnPay;
            });
            ASSESSORS.forEach(a => {
              (assessorDataM[a.id] || []).forEach(entry => {
                const addons = (entry.engExp ? ADDON_PRICE : 0) + (entry.mathExp ? ADDON_PRICE : 0) + (entry.fullDidactic ? ADDON_PRICE : 0);
                totalPayM += a.baseRate * (1 + VAT_RATE) + addons;
                assessorVatM += a.baseRate * VAT_RATE + addons * VAT_RATE / (1 + VAT_RATE);
              });
            });
            const isDan = e => DAN_CATS.includes(e.category);
            const regularExpM = expenses.reduce((s, e) => isDan(e) ? s : s + num(e.amount), 0);
            const regularExpVatM = expenses.reduce((s, e) => isDan(e) ? s : s + (e.vat ? num(e.amount) * VAT_RATE : 0), 0);
            const danExpVatM = expenses.reduce((s, e) => isDan(e) && e.vat ? s + num(e.amount) * VAT_RATE : s, 0);
            const specialExpense = num((inc.specialExpense || {}).amount);
            const specialExpenseVat = (inc.specialExpense && inc.specialExpense.vat) ? specialExpense * VAT_RATE : 0;
            const calcVatRefundM = regularExpVatM + therapistVatM + assessorVatM + specialExpenseVat + danExpVatM;
            const finalVatM = num(inc.finalVat);
            const effectiveVatM = finalVatM > 0 ? finalVatM : calcVatRefundM;
            const totalExpM = totalPayM + regularExpM + specialExpense;
            const netExpM = totalExpM - effectiveVatM;
            const specialIncomeM = num((inc.specialIncome || {}).amount);
            const manualIncomeM = num(inc.invoiceReport) + specialIncomeM;
            const netManualM = manualIncomeM - netExpM;
            results.push({ label: MONTH_NAMES[m - 1], netManual: netManualM, hasData: num(inc.invoiceReport) > 0 || manualIncomeM > 0 });
          } else {
            results.push({ label: MONTH_NAMES[m - 1], netManual: 0, hasData: false });
          }
        }
        return results;
      }, [month, year, therapists]);

      // ── Therapist hours data (current month) ──
      const therapistHours = useMemo(() =>
        therapists
          .map(t => ({ name: t.name, hours: num((therapistData[t.id] || {}).hours) }))
          .filter(t => t.hours > 0),
        [therapists, therapistData]
      );

      // ── Monthly total hours (last 12 months) ──
      const hoursMonths = useMemo(() => {
        const results = [];
        for (let i = 11; i >= 0; i--) {
          let m = month - i;
          let y = year;
          while (m <= 0) { m += 12; y -= 1; }
          const d = fromStorage(monthKey(m, y), null);
          let totalH = 0;
          if (d) {
            therapists.forEach(t => { totalH += num((d.therapistData || {})[t.id]?.hours); });
          }
          results.push({ label: MONTH_NAMES[m - 1], hours: totalH });
        }
        return results;
      }, [month, year, therapists]);

      // ── Chart 1: Monthly P&L line ──
      useChart(pnlRef, () => ({
        type: 'line',
        data: {
          labels: pnlMonths.map(d => d.label),
          datasets: [{
            label: 'רווח/הפסד ₪',
            data: pnlMonths.map(d => d.netManual),
            borderColor: '#10b981',
            backgroundColor: 'rgba(16,185,129,0.1)',
            pointBackgroundColor: pnlMonths.map(d => d.netManual >= 0 ? '#10b981' : '#ef4444'),
            pointRadius: 5,
            tension: 0.3,
            fill: true,
          }],
        },
        options: {
          responsive: true, maintainAspectRatio: true,
          plugins: { legend: { display: false },
            tooltip: { callbacks: { label: ctx => ` ₪${fmt(ctx.parsed.y)}` } },
          },
          scales: {
            y: { ticks: { callback: v => `₪${fmt(v)}` }, grid: { color: '#374151' } },
            x: { ticks: { font: { size: 10 }, color: '#9ca3af' }, grid: { display: false } },
          },
        },
      }), [pnlMonths]);

      // ── Chart 2: Income vs Expenses bar ──
      useChart(compareRef, () => ({
        type: 'bar',
        data: {
          labels: ['הכנסות (דוח)', 'הוצאות נטו', 'רווח/הפסד'],
          datasets: [{
            label: 'סכום ₪',
            data: [totals.manualIncome, totals.netExp, totals.netManual],
            backgroundColor: [
              '#3b82f6', '#ef4444',
              totals.netManual >= 0 ? '#10b981' : '#ef4444',
            ],
            borderRadius: 8,
            borderSkipped: false,
          }],
        },
        options: {
          responsive: true, maintainAspectRatio: true,
          plugins: { legend: { display: false } },
          scales: {
            y: { ticks: { callback: v => `₪${fmt(v)}` }, grid: { color: '#f1f5f9' } },
            x: { ticks: { font: { size: 11 } } },
          },
        },
      }), [totals]);

      // ── Chart 3: Monthly hours line ──
      useChart(therapistRef, () => ({
        type: 'line',
        data: {
          labels: hoursMonths.map(d => d.label),
          datasets: [{
            label: "שעות טיפול",
            data: hoursMonths.map(d => d.hours),
            borderColor: '#6366f1',
            backgroundColor: 'rgba(99,102,241,0.1)',
            pointBackgroundColor: '#6366f1',
            pointRadius: 5,
            tension: 0.3,
            fill: true,
          }],
        },
        options: {
          responsive: true, maintainAspectRatio: true,
          plugins: { legend: { display: false },
            tooltip: { callbacks: { label: ctx => ` ${ctx.parsed.y} ש׳` } },
          },
          scales: {
            y: { ticks: { callback: v => `${v} ש׳` }, grid: { color: '#374151' } },
            x: { ticks: { font: { size: 10 }, color: '#9ca3af' }, grid: { display: false } },
          },
        },
      }), [hoursMonths]);

      const totalHours = therapistHours.reduce((s, t) => s + t.hours, 0);

      const DC = 'bg-gray-800 border border-gray-700'; // dark card

      return (
        <div className="space-y-4">
          {/* Navigation buttons */}
          <div className="flex gap-2 flex-wrap">
            {[
              { key:'therapists', label:'מטפלים ומאבחנים', icon:'👤', desc:'מעקב תשלומי עובד' },
              { key:'expenses',   label:'הוצאות',         icon:'📋', desc:'ניהול הוצאות חודשיות' },
              { key:'income',     label:'הכנסות וסיכום', icon:'💰', desc:'הכנסות ורווח נקי' },
            ].map(t => (
              <button key={t.key} onClick={() => onNavigate(t.key)}
                className="flex items-center gap-3 bg-gray-800 border border-gray-700 hover:bg-gray-700 hover:border-gray-500 rounded-xl px-5 py-3 transition-all text-right">
                <span className="text-2xl">{t.icon}</span>
                <div>
                  <div className="text-white font-semibold text-sm">{t.label}</div>
                  <div className="text-gray-400 text-xs">{t.desc}</div>
                </div>
              </button>
            ))}
          </div>

          {/* KPI strip */}
          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
            <KpiCard label="הכנסות (דוח)"     value={`₪${fmt(totals.manualIncome)}`} color="green"  dark />
            <KpiCard label="הוצאות נטו"       value={`₪${fmt(totals.netExp)}`}       color="red"    dark />
            <KpiCard label="רווח/הפסד"        value={`${totals.netManual>=0?'+':'−'}₪${fmt(Math.abs(totals.netManual))}`} color={totals.netManual>=0?'green':'red'} dark />
            <KpiCard label="שעות מטפלים"      value={`${fmtDec(totalHours)} ש׳`}    color="blue"   dark />
            <KpiCard label="רווח ממטפלים"     value={`₪${fmt(totals.totalProfit)}`}  color="blue"   dark />
            <KpiCard label='החזר מע"מ'         value={`₪${fmt(totals.effectiveVat)}`} color="purple" dark />
          </div>

          {/* Charts row 1 */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            {/* Monthly P&L */}
            <div className={`${DC} rounded-2xl p-5`}>
              <h3 className="font-semibold text-white mb-1">רווח/הפסד — 12 חודשים אחרונים</h3>
              <p className="text-xs text-gray-400 mb-4">ירוק = רווח, אדום = הפסד</p>
              <canvas ref={pnlRef} />
            </div>

            {/* Income vs expenses */}
            <div className={`${DC} rounded-2xl p-5`}>
              <h3 className="font-semibold text-white mb-1">הכנסות מול הוצאות — {monthLabel}</h3>
              <p className="text-xs text-gray-400 mb-4">השוואה לפי שיטות חישוב</p>
              <canvas ref={compareRef} />
            </div>
          </div>

          {/* Charts row 2 */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            {/* Monthly hours line */}
            <div className={`${DC} rounded-2xl p-5`}>
              <h3 className="font-semibold text-white mb-1">שעות טיפול — 12 חודשים אחרונים</h3>
              <p className="text-xs text-gray-400 mb-4">סה"כ שעות טיפול לפי חודש</p>
              <canvas ref={therapistRef} />
            </div>

            {/* Therapist detail table */}
            <div className={`${DC} rounded-2xl p-5`}>
              <h3 className="font-semibold text-white mb-4">פירוט מטפלים פעילים</h3>
              {therapistHours.length > 0 ? (
                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead>
                      <tr className="bg-gray-700 border-b border-gray-600 text-gray-300">
                        <th className="text-right py-2 px-3 font-medium">מטפל</th>
                        <th className="text-center py-2 px-3 font-medium">שעות</th>
                        <th className="text-center py-2 px-3 font-medium">% מסה"כ</th>
                        <th className="text-center py-2 px-3 font-medium">תשלום</th>
                        <th className="text-center py-2 px-3 font-medium">רווח</th>
                      </tr>
                    </thead>
                    <tbody>
                      {therapistHours.map((t, i) => {
                        const th = therapists.find(x => x.name === t.name);
                        const pay    = th ? t.hours * th.therapistRate   : 0;
                        const profit = th ? t.hours * th.instituteProfit : 0;
                        const pct = totalHours > 0 ? Math.round(t.hours / totalHours * 100) : 0;
                        return (
                          <tr key={t.name} className={`border-b border-gray-700 ${i%2===1?'bg-gray-700/40':''}`}>
                            <td className="py-2 px-3 font-medium text-gray-100">
                              <span className="inline-block w-2.5 h-2.5 rounded-full ml-1" style={{background: CHART_COLORS[i % CHART_COLORS.length]}}></span>
                              {t.name}
                            </td>
                            <td className="py-2 px-3 text-center text-gray-200">{t.hours}</td>
                            <td className="py-2 px-3 text-center">
                              <div className="flex items-center gap-1.5 justify-center">
                                <div className="flex-1 bg-gray-600 rounded-full h-1.5 max-w-16">
                                  <div className="h-1.5 rounded-full bg-blue-400" style={{width:`${pct}%`}}></div>
                                </div>
                                <span className="text-xs text-gray-400">{pct}%</span>
                              </div>
                            </td>
                            <td className="py-2 px-3 text-center text-red-400 font-medium">₪{fmt(pay)}</td>
                            <td className="py-2 px-3 text-center text-emerald-400 font-medium">₪{fmt(profit)}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                    <tfoot>
                      <tr className="bg-slate-700 text-white">
                        <td className="py-2 px-3 font-bold">סה"כ</td>
                        <td className="py-2 px-3 text-center font-bold">{fmtDec(totalHours)}</td>
                        <td className="py-2 px-3 text-center">100%</td>
                        <td className="py-2 px-3 text-center font-bold text-red-300">₪{fmt(totals.totalPay)}</td>
                        <td className="py-2 px-3 text-center font-bold text-emerald-300">₪{fmt(totals.totalProfit)}</td>
                      </tr>
                    </tfoot>
                  </table>
                </div>
              ) : <EmptyChart text="אין מטפלים עם שעות מוזנות" dark />}
            </div>
          </div>
        </div>
      );
    }

    function EmptyChart({ text, dark }) {
      return (
        <div className={`flex items-center justify-center h-48 text-sm rounded-xl border border-dashed ${
          dark ? 'text-gray-500 bg-gray-700/30 border-gray-600' : 'text-slate-400 bg-slate-50 border-slate-300'
        }`}>
          {text}
        </div>
      );
    }

    function KpiCard({ label, value, color, dark }) {
      const light = {
        green:  'bg-emerald-50 border-emerald-200 text-emerald-800',
        red:    'bg-red-50     border-red-200     text-red-700',
        blue:   'bg-blue-50   border-blue-200   text-blue-800',
        purple: 'bg-violet-50 border-violet-200 text-violet-800',
      };
      const darkMap = {
        green:  'bg-emerald-900/40 border-emerald-700 text-emerald-300',
        red:    'bg-red-900/40    border-red-700    text-red-300',
        blue:   'bg-blue-900/40  border-blue-700  text-blue-300',
        purple: 'bg-violet-900/40 border-violet-700 text-violet-300',
      };
      return (
        <div className={`rounded-xl border p-3 ${dark ? darkMap[color] : light[color]}`}>
          <div className="text-xs opacity-60 mb-1 leading-tight">{label}</div>
          <div className="text-lg font-bold leading-tight">{value}</div>
        </div>
      );
    }

    // ─── RENDER ───────────────────────────────────────────────────────────────

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
